<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Painel do Barbeiro — Denner Barbearia</title>
<meta name="theme-color" content="#04060c">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div class="login-wrap" id="login-screen">
  <div class="login-logo">
    <div class="word">DENNER <span class="g">BARBEARIA</span></div>
    <div class="sub">Painel do Barbeiro</div>
  </div>
  <div class="field"><label>Login (e-mail cadastrado)</label><input type="email" id="login-email" placeholder="seu@email.com"></div>
  <div class="field"><label>Senha</label><input type="password" id="login-senha" placeholder="••••••••"></div>
  <button class="btn btn-primary" id="btn-login">ENTRAR</button>
  <button class="btn btn-ghost" id="btn-back-site">Voltar para o site</button>
</div>

<!-- ===================== PAINEL ===================== -->
<div class="app-shell hidden" id="barber-shell" style="max-width:480px;padding-bottom:40px;">
  <header class="app-header">
    <div class="brand"><span class="dot"></span> MINHA AGENDA</div>
    <button class="icon-btn" id="btn-logout" aria-label="Sair"><span data-icon="logout"></span></button>
  </header>

  <div class="screen">
    <h1 class="page-title" style="text-align:left;font-size:20px;text-transform:none;margin-top:6px;">Olá, <span class="accent" id="barber-name-label">Barbeiro</span></h1>

    <div class="sidebar-tabs" id="day-tabs" style="padding:0 0 14px;"></div>

    <div class="section-heading" id="agenda-heading">AGENDA DE HOJE</div>
    <div id="barber-agenda"><div class="loader"></div></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="utils.js"></script>
<script src="barbeiro.js"></script>
</body>
</html>
